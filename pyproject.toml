[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "information-mapper"
version = "0.2.0"
description = "基层办公自动化工具箱：文档信息提取、格式转换、批量合并、自动归档与上传"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "pypdf>=4.0",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0"]
ocr = [
    "rapidocr-onnxruntime>=1.2.0",
    "pypdfium2>=4.20.0",
    "Pillow>=10.0.0",
]
dev = ["pytest>=8.0"]

[project.scripts]
info-map = "information_mapper.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
